# Запуск: docker compose up --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: omut
      POSTGRES_USER: omut
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omut_dev}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omut"]
      interval: 5s
      retries: 10

  api:
    build: ./server/Omut.Api
    environment:
      ConnectionStrings__Default: Host=db;Database=omut;Username=omut;Password=${POSTGRES_PASSWORD:-omut_dev}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:8080"

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db-data:
