name: Баг
description: Что-то работает не так
title: "[Баг] "
projects: ["omut-team/1"]
labels: ["баг"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Что делал (шаги)
      placeholder: |
        1. Запустил игру
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидал
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что получилось
      description: Можно вставить скриншот или видео
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия / ветка
      placeholder: dev, 0.2
