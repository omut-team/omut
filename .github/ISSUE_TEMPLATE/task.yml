name: Задача
description: Новая задача (код, арт, документ)
title: "[Задача] "
projects: ["omut-team/1"]
body:
  - type: textarea
    id: what
    attributes:
      label: Что сделать
      description: Коротко и конкретно
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Как понять, что готово
      placeholder: |
        - [ ] ...
        - [ ] ...
  - type: dropdown
    id: patch
    attributes:
      label: Патч
      options: ["0.1", "0.2", "0.3", "0.4", "1.0"]
  - type: input
    id: stage
    attributes:
      label: Этап из docs/PLAN.md
      description: К какому этапу кода это нужно (номер 1–22), если есть
      placeholder: "5"
  - type: dropdown
    id: who
    attributes:
      label: Кто делает
      options: ["Ярослав", "Илья", "Ульяна", "Лиза", "Сарина", "все"]
